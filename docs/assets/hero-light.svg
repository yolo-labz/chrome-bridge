<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="cb-hero-light-title cb-hero-light-desc">
  <title id="cb-hero-light-title">chrome-bridge: trusted-event Chrome MV3 automation bridge</title>
  <desc id="cb-hero-light-desc">Catppuccin Latte card. Left panel shows the wordmark chrome-bridge in mauve over a monospaced tagline. Right panel shows a mauve MV3 puzzle-piece glyph connected by a blue arrow to a terminal prompt glyph, with a small Chrome devtools wedge anchoring the lower-right corner.</desc>
  <rect width="1200" height="360" fill="#eff1f5"/>
  <rect x="0" y="0" width="1200" height="3" fill="#8839ef"/>
  <g font-family="ui-serif,Georgia,'Iowan Old Style','Apple Garamond',serif" fill="#4c4f69">
    <text x="72" y="170" font-size="76" font-weight="700" letter-spacing="-3">chrome-bridge</text>
  </g>
  <g font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,monospace" fill="#6c6f85">
    <text x="76" y="218" font-size="20">trusted-event chrome mv3 bridge</text>
    <text x="76" y="246" font-size="20">extension + python relay on :9224</text>
  </g>
  <g font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,monospace" fill="#8c8fa1">
    <text x="76" y="296" font-size="14">git clone github.com/yolo-labz/chrome-bridge</text>
  </g>
