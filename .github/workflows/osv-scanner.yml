name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: OSV-Scanner V2
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      # No supported dependency manifests today; still scan any added later.
      scan-args: |-
        --recursive
        --allow-no-lockfiles
        ./
      upload-sarif: true
