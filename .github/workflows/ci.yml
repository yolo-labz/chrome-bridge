name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny-all at workflow top-level; jobs re-grant the minimum scopes they need.
# Hardening per spec 024 §2.3 PR-E + release-engineering canon.
permissions: {}

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Run shellcheck on launch scripts
        run: |
          shopt -s nullglob
          shellcheck launch/*.sh
      - name: Syntax-check cli/cb (bash shebang dispatch script)
        run: |
          if head -n1 cli/cb | grep -qE '^#!.*python'; then
            python3 -m py_compile cli/cb
          else
            bash -n cli/cb
          fi

  python-lint:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Compile cli/cb
        run: python3 -m py_compile cli/cb
      - name: Compile scripts/*.py
        run: |
          shopt -s nullglob
          for f in scripts/*.py; do python3 -m py_compile "$f"; done

  manifest-validate:
    name: Extension manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate manifest.json
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("extension/manifest.json"))
          assert m.get("manifest_version") == 3, "must be MV3"
          assert m.get("name"), "name required"
          assert m.get("version"), "version required"
          assert "background" in m and m["background"].get("service_worker"), "service worker required"
          for f in [m["background"]["service_worker"]]:
              open(f"extension/{f}").close()
          for cs in m.get("content_scripts", []):
              for js in cs.get("js", []):
                  open(f"extension/{js}").close()
          for war in m.get("web_accessible_resources", []):
              for res in war.get("resources", []):
                  open(f"extension/{res}").close()
          print("manifest.json OK")
          PY

  js-syntax:
    name: Extension JS syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Syntax-check extension JS
        run: |
          shopt -s nullglob
          for f in extension/*.js; do
            node --check "$f"
          done

  actionlint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -C /tmp -xzf /tmp/actionlint.tgz actionlint
          /tmp/actionlint -color
      - name: Install zizmor
        run: |
          python3 -m pip install --user zizmor==1.5.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: zizmor audit
        run: zizmor --format sarif .github/workflows/ > zizmor.sarif || true
