name: ruff
# Lint gate for chrome-bridge (the one yolo-labz Python repo without ruff CI;
# its six siblings already run `ruff check` + `ruff format --check` blocking).
# Initial tier is REPORT-ONLY via `continue-on-error` while the existing
# backlog (mostly E501 line-length) is burned down; drop that line to make it
# blocking (report-only -> block; never loosen). Config lives in ruff.toml,
# mirroring the fleet ruleset.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  ruff:
    name: ruff (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.12'
      - name: ruff check
        continue-on-error: true
        run: uvx ruff@0.15.15 check --output-format=github .
