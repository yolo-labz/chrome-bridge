name: ruff
# Lint gate for chrome-bridge (the one yolo-labz Python repo without ruff CI;
# its six siblings already run `ruff check` + `ruff format --check` blocking).
# Initial tier is REPORT-ONLY via `continue-on-error` while the existing
# backlog (mostly E501 line-length) is burned down; drop that line to make it
# blocking (report-only -> block; never loosen). Config lives in ruff.toml,
# mirroring the fleet ruleset.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  ruff:
    name: ruff (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: '3.12'
      - name: ruff check
        continue-on-error: true
        run: uvx ruff@0.15.15 check --output-format=github .
