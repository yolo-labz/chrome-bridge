name: ruff
# Lint gate for chrome-bridge (the one yolo-labz Python repo without ruff CI;
# its six siblings already run `ruff check` + `ruff format --check` blocking).
# Initial tier is REPORT-ONLY via `continue-on-error` while the existing
# backlog (mostly E501 line-length) is burned down; drop that line to make it
# blocking (report-only -> block; never loosen). Config lives in ruff.toml,
# mirroring the fleet ruleset.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  ruff:
    name: ruff (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - name: ruff check
        continue-on-error: true
        run: uvx ruff@0.15.15 check --output-format=github .
