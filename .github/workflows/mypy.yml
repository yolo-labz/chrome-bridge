name: mypy
# Per-language type gate for the yolo-labz Python archetype (ruff + mypy).
# BLOCKING: mypy is clean on this repo, so a new type error fails the check
# (ratcheted up from the report-only initial tier; report-only -> block, never
# loosen). Findings are also posted to the job summary.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
      - name: mypy
        run: |
          if [ -d src ]; then TGT=src; else TGT=.; fi
          {
            echo '## mypy report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uvx mypy@2.1.0 --ignore-missing-imports --no-error-summary "$TGT" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
