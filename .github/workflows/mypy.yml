name: mypy
# Per-language type gate for the yolo-labz Python archetype (ruff + mypy).
# BLOCKING: mypy is clean on this repo, so a new type error fails the check
# (ratcheted up from the report-only initial tier; report-only -> block, never
# loosen). Findings are also posted to the job summary.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.12'
      - name: mypy
        run: |
          if [ -d src ]; then TGT=src; else TGT=.; fi
          {
            echo '## mypy report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uvx mypy@2.1.0 --ignore-missing-imports --no-error-summary "$TGT" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
