name: mypy
# Per-language type gate for the yolo-labz Python archetype (ruff + mypy).
# BLOCKING: mypy is clean on this repo, so a new type error fails the check
# (ratcheted up from the report-only initial tier; report-only -> block, never
# loosen). Findings are also posted to the job summary.
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: '3.12'
      - name: mypy
        run: |
          if [ -d src ]; then TGT=src; else TGT=.; fi
          {
            echo '## mypy report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uvx mypy@2.1.0 --ignore-missing-imports --no-error-summary "$TGT" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
